name: CI

on: 
    push:
        branches:
            - main 

    pull_request: 
        branches:
            - main 

jobs: 
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Pnpm_Setup
              uses: pnpm/action-setup@v4
              with: 
                node-version: 22
                cache: 'pnpm'

            - name: Install Packages 
              run: pnpm install --frozen-lockfile

            - name: Run-Test
              run: echo "testing successfull!"
            
