name: CI

on: 
    push:
        branches:
            - main 

    pull_request: 
        branches:
            - main 

jobs: 
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Nodejs-Setup
              uses: actions/setup-node@v4
              with: 
                node-version: 22

            - name: Install Packages 
              run: npm-ci

            - name: Run-Test
              run: npm run test 
            
