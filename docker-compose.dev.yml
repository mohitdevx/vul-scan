services:
  db:
    image: postgres:16-alpine
    container_name: vulnscan-db
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vulnscan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vulnscan_password}
      POSTGRES_DB: ${POSTGRES_DB:-vulnscan_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-vulnscan} -d $${POSTGRES_DB:-vulnscan_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vulnscan-network

  redis:
    image: redis:7-alpine
    container_name: vulnscan-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - vulnscan-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  vulnscan-network:
    driver: bridge